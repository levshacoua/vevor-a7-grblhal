<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lefty's Laser</title>
<style>
  :root { --bg:#101418; --card:#1a2027; --tx:#e8edf2; --mut:#8b98a5; --acc:#4f8cff; --ok:#31c47e; --warn:#f0a832; --err:#e5534b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); font:16px/1.45 -apple-system,system-ui,sans-serif; padding:16px; max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 14px; display:flex; align-items:center; gap:10px; }
  h1 .dot { width:12px; height:12px; border-radius:50%; background:var(--mut); }
  h1 .dot.on { background:var(--ok); }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px; }
  .state { font-size:15px; color:var(--mut); }
  .state b { color:var(--tx); font-size:17px; }
  .bar { height:10px; background:#0b0e12; border-radius:6px; overflow:hidden; margin:10px 0 4px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .5s; }
  .file { display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid #242c35; }
  .file:last-child { border-bottom:0; }
  .file .nm { flex:1; word-break:break-all; }
  .file .sz { color:var(--mut); font-size:13px; white-space:nowrap; }
  button { border:0; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:600; color:#fff; background:var(--acc); cursor:pointer; }
  button:disabled { opacity:.35; cursor:default; }
  button.run { background:var(--ok); }
  button.warn { background:var(--warn); color:#222; }
  button.err { background:var(--err); }
  .row { display:flex; gap:10px; margin-top:10px; }
  .row button { flex:1; }
  .msg { color:var(--mut); font-size:14px; margin-top:8px; min-height:18px; }
  .refresh { background:#2a3542; }
</style>
</head>
<body>
<h1><span class="dot" id="dot"></span>Lefty's Laser <span style="color:var(--mut);font-weight:400;font-size:14px" id="host"></span></h1>

<div class="card">
  <div class="state">Стан: <b id="state">…</b> <span id="job"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row">
    <button class="warn" id="pause" disabled onclick="jobAction('PAUSE')">⏸ Пауза</button>
    <button class="run"  id="resume" disabled onclick="jobAction('RESUME')">▶ Далі</button>
    <button class="err"  id="abort" disabled onclick="if(confirm('Зупинити роботу?'))jobAction('ABORT')">⏹ Стоп</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
    <b>Файли на SD</b>
    <button class="refresh" onclick="listFiles()">Оновити</button>
  </div>
  <div id="files" class="state">завантаження…</div>
</div>

<script>
const q = s => document.getElementById(s);
q('host').textContent = location.hostname;
let running = false;

async function api(cmd) {
  const r = await fetch('/command?cmd=' + encodeURIComponent(cmd), {cache:'no-store'});
  return r.text();
}

async function listFiles() {
  q('files').textContent = 'завантаження…';
  try {
    const r = await fetch('/sdfiles?path=/&action=list', {cache:'no-store'});
    const d = await r.json();
    const ok = ['.nc','.gc','.gcode','.tap','.ngc'];
    const fs = (d.files||[]).filter(f => f.size !== -1 && !f.name.startsWith('.')
                 && ok.some(e => f.name.toLowerCase().endsWith(e)));
    if(!fs.length) { q('files').textContent = 'немає G-code файлів'; return; }
    q('files').innerHTML = fs.map(f =>
      `<div class="file"><span class="nm">${f.name}</span><span class="sz">${f.size}</span>
       <button class="run" ${running?'disabled':''} onclick="runFile('${f.name}')">Пуск</button></div>`).join('');
  } catch(e) { q('files').textContent = 'помилка читання SD: ' + e; }
}

async function runFile(name) {
  if(!confirm('Запустити «' + name + '»?\nМашина спершу схомиться, потім почне різати!')) return;
  q('msg').textContent = 'стартую ' + name + '…';
  await api('RUNSD=/' + name);
  setTimeout(poll, 800);
}

async function jobAction(a) {
  await api('[ESP701]action=' + a);
  setTimeout(poll, 500);
}

async function poll() {
  try {
    const t = await api('[ESP701]json=yes');
    const d = JSON.parse(t).data || {};
    q('dot').className = 'dot on';
    if(d.status === 'processing' || d.status === 'pause stream') {
      running = true;
      const pct = d.total && d.processed ? Math.round(d.processed / d.total * 100) : null;
      q('state').textContent = d.status === 'pause stream' ? 'ПАУЗА' : 'ПРАЦЮЄ';
      q('job').textContent = (d.name||'') + (pct !== null ? ' — ' + pct + '%' : '');
      q('bar').style.width = (pct||0) + '%';
      q('pause').disabled = d.status === 'pause stream';
      q('resume').disabled = d.status !== 'pause stream';
      q('abort').disabled = false;
    } else {
      running = false;
      q('state').textContent = 'ВІЛЬНИЙ';
      q('job').textContent = '';
      q('bar').style.width = '0';
      q('pause').disabled = q('resume').disabled = q('abort').disabled = true;
    }
  } catch(e) {
    q('dot').className = 'dot';
    q('state').textContent = 'немає зв’язку';
  }
  setTimeout(poll, running ? 1500 : 4000);
}

listFiles();
poll();
</script>
</body>
</html>
